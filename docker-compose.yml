services:
  cloud:
    build: .
    image: cloud-control-panel:latest
    container_name: cloud
    restart: unless-stopped
    user: "${CLOUD_UID:-1000}:${CLOUD_GID:-1000}"
    env_file:
      - path: .env
        required: false
    ports:
      - "${CLOUD_BIND:-127.0.0.1}:${CLOUD_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 25s
